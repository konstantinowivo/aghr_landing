<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/images/logo/aghr_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AGHR Mentoring & HR - Consultoría en Recursos Humanos y desarrollo profesional en Buenos Aires, Argentina. Servicios de selección, capacitación y mentoring para empresas y profesionales." />
    <meta name="theme-color" content="#4f46e5" />
    <meta http-equiv="Cache-Control" content="public, max-age=31536000, immutable" />
    <meta http-equiv="Expires" content="31536000" />

    <!-- Preconnect para optimización de fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fuentes optimizadas con display=swap para evitar FOIT -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      />
    </noscript>

    <!-- Preload de recursos críticos -->
    <link rel="preload" href="/src/assets/images/logo/aghr_logo.png" as="image" type="image/png" fetchpriority="high" />
    <link rel="modulepreload" href="/src/main.js" fetchpriority="high" />

    <!-- CSS crítico inline para evitar FOUC y forced reflows -->
    <style>
      /* Reset y base */
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;scroll-behavior:smooth}
      body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5;overflow-x:hidden;background:#fff}

      /* Layout containers con dimensiones fijas para prevenir reflow */
      #app{min-height:100vh;display:flex;flex-direction:column;contain:layout}

      /* Hero section - dimensiones explícitas para LCP */
      .hero-modern{position:relative;width:100%;height:100vh;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);contain:layout style paint}

      /* Optimización de fuentes - prevenir FOIT/FOUT */
      @font-face{font-family:'Inter-fallback';size-adjust:100%;src:local('Arial')}
      @font-face{font-family:'Plus Jakarta Sans-fallback';size-adjust:100%;src:local('Arial')}

      /* Video background placeholder */
      .video-background{position:absolute;inset:0;background:#4f46e5;will-change:auto}

      /* Prevenir layout shift en imágenes */
      img{max-width:100%;height:auto;display:block}

      /* Skeleton loader base */
      .image-skeleton{background:linear-gradient(135deg,#f5f5f5 0%,#e8e8e8 100%);animation:pulse 2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.7}}
    </style>

    <title>AGHR | mentoring & HR</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
