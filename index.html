<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="AGHR Mentoring & HR - Consultoría en Recursos Humanos y desarrollo profesional en Buenos Aires, Argentina. Servicios de selección, capacitación y mentoring para empresas y profesionales." />
    <meta name="keywords" content="recursos humanos, RRHH, mentoring, coaching, selección de personal, capacitación, Buenos Aires, Argentina, consultoría HR" />
    <meta name="author" content="AGHR Mentoring & HR" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://aghr-project.vercel.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aghr-project.vercel.app/" />
    <meta property="og:title" content="AGHR | Mentoring & HR - Consultoría en Recursos Humanos" />
    <meta property="og:description" content="Potenciamos el talento de empresas y profesionales. Servicios de selección, capacitación, mentoring y desarrollo profesional en Argentina y LATAM." />
    <meta property="og:site_name" content="AGHR Mentoring & HR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AGHR | Mentoring & HR" />
    <meta name="twitter:description" content="Consultoría en Recursos Humanos y desarrollo profesional en Buenos Aires, Argentina." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/images/logo/aghr_logo.svg" />

    <!-- Performance: DNS Prefetch for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Optimized Font Loading: Preconnect + Preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Preload critical fonts with font-display: swap -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"></noscript>

    <title>AGHR | mentoring & HR</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
